<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Hz-Plant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6B4F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hz-Plant">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="hbtn" onclick="openDrawer()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="titles">
      <div class="eyebrow" id="tb-eyebrow">BERANDA</div>
      <div class="titlemain" id="tb-title">Ringkasan</div>
    </div>
  </div>

  <div id="screens">
    <div class="screen" id="screen-beranda"></div>
    <div class="screen" id="screen-catat"></div>
    <div class="screen" id="screen-riwayat"></div>
    <div class="screen" id="screen-peta"></div>
  </div>

  <nav id="bottomnav">
    <button data-tab="beranda" onclick="showScreen('beranda')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      Beranda
    </button>
    <button data-tab="catat" onclick="showScreen('catat')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/><path d="M12 13v4M10 15h4"/></svg>
      Catat Kerja
    </button>
    <button data-tab="riwayat" onclick="showScreen('riwayat')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>
      Riwayat
    </button>
    <button data-tab="peta" onclick="showScreen('peta')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
      Peta
    </button>
  </nav>
</div>

<div id="drawerOverlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dhead">
    <div class="name" id="dw-name">Nama belum diisi</div>
  </div>
  <div class="dgroup">Akun</div>
  <div class="ditem" onclick="openSettingAkun()"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 000-2l2-1.5-2-3.4-2.4 1a8 8 0 00-1.7-1L15 3h-4l-.3 2.6a8 8 0 00-1.7 1l-2.4-1-2 3.4L6.6 11a7.97 7.97 0 000 2l-2 1.5 2 3.4 2.4-1a8 8 0 001.7 1L11 21h4l.3-2.6a8 8 0 001.7-1l2.4 1 2-3.4-2-1.5z"/></svg></span> Pengaturan Akun</div>
  <div class="dgroup">Master Data</div>
  <div class="ditem" onclick="openKelolaPekerja()"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.5 15.2c2.6.3 4.5 2 4.5 4.8"/></svg></span> Kelola Pekerja</div>
  <div class="ditem" onclick="openKelolaBlok()"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg></span> Kelola No Blok</div>
  <div class="ditem" onclick="openKelolaHerbisida()"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9.5A1.5 1.5 0 005.8 21h12.4a1.5 1.5 0 001.3-2.5L14 9V3"/><path d="M7.5 15h9"/></svg></span> Kelola Herbisida</div>
  <div class="dgroup">Peta</div>
  <div class="ditem" onclick="triggerPetaUpload()"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/><circle cx="12" cy="13" r="3.5"/></svg></span> Ganti Gambar Peta</div>
  <input type="file" id="petaFileInput" accept="image/*" style="display:none;" onchange="handlePetaUpload(event)">
  <div class="dgroup">Tentang</div>
  <div class="drawer-version" id="dw-version">Hz-Plant &middot; Versi 0.1.0</div>
</div>

<div id="modalOverlay"><div id="modalSheet"></div></div>
<div id="toast"></div>

<script src="app.js" defer></script>
</body>
</html>
